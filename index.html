<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pure Performance Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                black: '#000000',     // Pure black
                dark: '#111111',      // Soft black
                white: '#ffffff',     // Pure white
                gray: '#f3f4f6',      // Light gray for backgrounds
                accent: '#d946ef',    // Magenta/Pink from banner
                blue: '#3b82f6',      // Blue from banner
              }
            },
            fontFamily: {
              sans: ['"Inter"', 'sans-serif'],
              brand: ['"Inter"', 'sans-serif'], // We will use specific weights for the brand look
            },
            backgroundImage: {
              'brand-gradient': 'linear-gradient(to right, #d946ef, #3b82f6)',
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.4s ease-out',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "uuid": "https://esm.sh/uuid@^13.0.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-white text-brand-black font-sans antialiased h-screen overflow-hidden selection:bg-brand-black selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
